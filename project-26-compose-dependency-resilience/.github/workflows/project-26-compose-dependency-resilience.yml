name: Project 26 - Compose Dependency Resilience

on:
  push:
    branches:
      - project-26-compose-dependency-resilience
  pull_request:
    branches:
      - project-26-compose-dependency-resilience

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest PyYAML

      - name: Run tests
        run: pytest -q

      - name: Validate Compose
        run: docker compose config

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Verify dependency and application health
        run: |
          set -e
          for i in $(seq 1 30); do
            docker compose ps
            if curl -fsS http://localhost:5001/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify application functionality
        run: curl -fsS http://localhost:5001/

      - name: Verify dependency readiness
        run: |
          docker compose exec -T app \
            python -c "import requests; r=requests.get('http://dependency:5000/health'); assert r.ok; print(r.json())"

      - name: Shutdown
        if: always()
        run: docker compose down -v
