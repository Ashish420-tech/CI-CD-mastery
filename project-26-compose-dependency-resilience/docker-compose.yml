services:
  dependency:
    build:
      context: .
      dockerfile: dependency/Dockerfile
    environment:
      STARTUP_DELAY: "5"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=1)"
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s
    restart: on-failure
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      dependency:
        condition: service_healthy
        restart: true
    environment:
      DEPENDENCY_URL: http://dependency:5000
      MAX_RETRIES: "15"
      RETRY_DELAY: "1"
    ports:
      - "5001:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: on-failure
    security_opt:
      - no-new-privileges:true
