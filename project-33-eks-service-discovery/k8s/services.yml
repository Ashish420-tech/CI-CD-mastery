apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: project-33
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: python:3.12-slim
          command:
            - python
            - -c
            - |
              import json
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body=json.dumps({"service":"service-a","status":"healthy"}).encode()
                      self.send_response(200)
                      self.send_header("Content-Type","application/json")
                      self.send_header("Content-Length",str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              HTTPServer(("0.0.0.0",5000),H).serve_forever()
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
          livenessProbe:
            httpGet:
              path: /
              port: 5000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  namespace: project-33
spec:
  type: ClusterIP
  selector:
    app: service-a
  ports:
    - port: 5000
      targetPort: 5000
---
