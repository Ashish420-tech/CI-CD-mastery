apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: project-33
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: project-33-gateway:latest
          imagePullPolicy: Never
          env:
            - name: SERVICE_A_URL
              value: http://service-a.project-33.svc.cluster.local:5000
            - name: SERVICE_B_URL
              value: http://service-b.project-33.svc.cluster.local:5000
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: project-33
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 5000
      targetPort: 5000
