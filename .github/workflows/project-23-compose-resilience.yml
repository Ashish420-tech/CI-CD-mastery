name: Project 23 - Compose Resilience

on:
  push:
    branches:
      - project-23-compose-resilience
    paths:
      - 'project-23-compose-resilience/**'
      - '.github/workflows/project-23-compose-resilience.yml'
  pull_request:
    paths:
      - 'project-23-compose-resilience/**'
      - '.github/workflows/project-23-compose-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    name: Test Docker Compose Resilience
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-23-compose-resilience

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and Compose tests
        run: python -m pytest -v

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Build Docker image
        run: docker compose build

      - name: Run resilience verification
        run: |
          cp .env.example .env
          ./verify-resilience.sh

      - name: Show containers on failure
        if: failure()
        run: docker compose ps -a

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
