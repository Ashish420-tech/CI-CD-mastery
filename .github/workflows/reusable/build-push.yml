name: Reusable Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .

    outputs:
      image:
        description: ECR image reference
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: ECR image digest
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build, Scan and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define image
        id: meta
        shell: bash
        run: |
          REGISTRY="742820980479.dkr.ecr.ap-south-1.amazonaws.com"
          IMAGE="$REGISTRY/${{ inputs.image_name }}"
          echo "image=$IMAGE:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ steps.meta.outputs.image }}" \
            "${{ inputs.context }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image
        id: push
        shell: bash
        run: |
          docker push "${{ steps.meta.outputs.image }}"

          DIGEST="$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            "${{ steps.meta.outputs.image }}" | cut -d@ -f2)"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          echo "IMAGE=${{ steps.meta.outputs.image }}"
          echo "DIGEST=$DIGEST"

          aws ecr describe-images \
            --repository-name "${{ inputs.image_name }}" \
            --image-ids imageTag="${GITHUB_SHA}" \
            --region ap-south-1
