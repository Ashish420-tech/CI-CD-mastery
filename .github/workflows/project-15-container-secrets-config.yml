name: Project 15 - Container Secrets and Configuration

on:
  push:
    branches:
      - project-15-container-secrets-config
    paths:
      - 'project-15-container-secrets-config/**'
      - '.github/workflows/project-15-container-secrets-config.yml'

  pull_request:
    branches:
      - project-15-container-secrets-config
    paths:
      - 'project-15-container-secrets-config/**'
      - '.github/workflows/project-15-container-secrets-config.yml'

jobs:
  container-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask

      - name: Run tests
        run: |
          python -m pytest -q project-15-container-secrets-config

      - name: Build Docker image
        run: |
          docker build \
            -t ci-cd-mastery-project-15:1.0.0 \
            ./project-15-container-secrets-config

      - name: Run container with runtime configuration
        run: |
          docker run -d \
            --name project-15-app \
            -p 8093:5000 \
            -e APP_VERSION=2.5.0 \
            -e ENVIRONMENT=production \
            -e APP_MESSAGE="Runtime configuration works" \
            ci-cd-mastery-project-15:1.0.0

      - name: Wait for healthy container
        run: |
          for i in {1..20}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              project-15-app)

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs project-15-app
              exit 1
            fi

            sleep 2
          done

          docker logs project-15-app
          exit 1

      - name: Verify runtime configuration
        run: |
          RESPONSE=$(curl -fsS http://localhost:8093/config)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep '"environment":"production"'
          echo "$RESPONSE" | grep '"version":"2.5.0"'

      - name: Verify environment variables
        run: |
          docker exec project-15-app env \
            | grep -E 'APP_VERSION|ENVIRONMENT|APP_MESSAGE'

      - name: Verify container state
        run: |
          docker inspect project-15-app \
            --format 'status={{.State.Status}} health={{.State.Health.Status}}'

      - name: Verify health endpoint
        run: |
          curl -fsS http://localhost:8093/health

      - name: Cleanup
        if: always()
        run: |
          docker rm -f project-15-app 2>/dev/null || true
