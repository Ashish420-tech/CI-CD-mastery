name: Project 09 - Image Security Scan

on:
  push:
    branches:
      - project-09-image-security-scanning
    paths:
      - 'project-09-image-security-scanning/**'
      - '.github/workflows/project-09-image-security.yml'

  pull_request:
    paths:
      - 'project-09-image-security-scanning/**'
      - '.github/workflows/project-09-image-security.yml'

permissions:
  contents: read

jobs:
  security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run tests
        working-directory: project-09-image-security-scanning
        run: pytest -q

      - name: Build Docker image
        run: |
          docker build \
            -t ci-cd-mastery-project-09:${{ github.sha }} \
            ./project-09-image-security-scanning

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ci-cd-mastery-project-09:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
