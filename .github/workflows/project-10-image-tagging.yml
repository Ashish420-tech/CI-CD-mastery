name: Project 10 - Image Tagging Lifecycle

on:
  push:
    branches:
      - project-10-image-tagging-lifecycle
    paths:
      - 'project-10-image-tagging-lifecycle/**'
      - '.github/workflows/project-10-image-tagging.yml'

  pull_request:
    paths:
      - 'project-10-image-tagging-lifecycle/**'
      - '.github/workflows/project-10-image-tagging.yml'

permissions:
  contents: read

env:
  IMAGE_NAME: ci-cd-mastery-project-10

jobs:
  build-tag:
    name: Build and Tag Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        working-directory: project-10-image-tagging-lifecycle
        run: |
          python -m pip install --upgrade pytest
          pytest -q

      - name: Build image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            ./project-10-image-tagging-lifecycle

      - name: Create lifecycle tags
        run: |
          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:1.0.0"

          docker tag \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${IMAGE_NAME}:latest"

      - name: Verify tags
        run: |
          docker image ls "${IMAGE_NAME}"

          docker image inspect "${IMAGE_NAME}:${GITHUB_SHA}" >/dev/null
          docker image inspect "${IMAGE_NAME}:sha-${GITHUB_SHA::7}" >/dev/null
          docker image inspect "${IMAGE_NAME}:1.0.0" >/dev/null
          docker image inspect "${IMAGE_NAME}:latest" >/dev/null

          echo "All image tags validated successfully."
