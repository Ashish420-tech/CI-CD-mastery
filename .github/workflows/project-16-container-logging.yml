name: Project 16 - Container Logging

on:
  push:
    branches:
      - project-16-container-logging
    paths:
      - 'project-16-container-logging/**'
      - '.github/workflows/project-16-container-logging.yml'

  pull_request:
    branches:
      - project-16-container-logging
    paths:
      - 'project-16-container-logging/**'
      - '.github/workflows/project-16-container-logging.yml'

jobs:
  container-logging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask

      - name: Run tests
        run: |
          python -m pytest -q project-16-container-logging

      - name: Build Docker image
        run: |
          docker build \
            -t ci-cd-mastery-project-16:1.0.0 \
            ./project-16-container-logging

      - name: Run container
        run: |
          docker run -d \
            --name project-16-app \
            -p 8094:5000 \
            -e APP_VERSION=1.0.0 \
            -e ENVIRONMENT=ci \
            ci-cd-mastery-project-16:1.0.0

      - name: Wait for healthy container
        run: |
          for i in {1..20}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              project-16-app)

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs project-16-app
              exit 1
            fi

            sleep 2
          done

          docker logs project-16-app
          exit 1

      - name: Generate application logs
        run: |
          curl -fsS http://localhost:8094/
          curl -fsS http://localhost:8094/health
          curl -s http://localhost:8094/error || true

      - name: Verify container logs
        run: |
          docker logs project-16-app 2>&1 | tee container.log

          grep -q "application_starting" container.log
          grep -q "request_received" container.log
          grep -q "healthcheck endpoint=/health" container.log
          grep -q "simulated_application_error" container.log

      - name: Verify logging driver
        run: |
          DRIVER=$(docker inspect project-16-app \
            --format '{{.HostConfig.LogConfig.Type}}')

          echo "Logging driver: $DRIVER"

          test "$DRIVER" = "json-file"

      - name: Verify container state
        run: |
          docker inspect project-16-app \
            --format 'status={{.State.Status}} health={{.State.Health.Status}}'

      - name: Verify timestamped logs
        run: |
          docker logs -t --tail 20 project-16-app

      - name: Cleanup
        if: always()
        run: |
          docker rm -f project-16-app 2>/dev/null || true
