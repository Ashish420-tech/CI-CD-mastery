name: Project 38 - EKS Application Platform CI/CD

on:
  push:
    branches:
      - project-38-eks-application-platform
  pull_request:
    branches:
      - project-38-eks-application-platform

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ci-cd-mastery/applications
  EKS_CLUSTER: ci-cd-mastery-eks
  NAMESPACE: project-38
  RELEASE_NAME: project-38
  CHART_PATH: project-38-eks-application-platform/chart/project-38-app
  IMAGE_NAME: project-38-eks-app

jobs:
  security:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Application Tests
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r project-38-eks-application-platform/app/requirements.txt
          pip install pytest PyYAML

      - name: Run tests
        run: |
          pytest -q project-38-eks-application-platform/tests

  helm:
    name: Helm Validation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.2

      - name: Helm lint
        run: |
          helm lint project-38-eks-application-platform/chart/project-38-app

      - name: Helm template
        run: |
          helm template project-38 \
            project-38-eks-application-platform/chart/project-38-app \
            --namespace project-38 \
            --set image.repository="$IMAGE_NAME" \
            --set image.tag="${GITHUB_SHA}"

  build:
    name: Docker Build and Trivy
    needs:
      - test
      - helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build immutable image
        run: |
          docker build \
            -t "$IMAGE_NAME:${GITHUB_SHA}" \
            project-38-eks-application-platform/app

      - name: Trivy HIGH/CRITICAL scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: project-38-eks-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy to EKS
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::742820980479:role/GitHubActionsEnterpriseCapstoneRole
          aws-region: ap-south-1
          allowed-account-ids: "742820980479"

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          docker build \
            -t "$IMAGE" \
            project-38-eks-application-platform/app

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Resolve image digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          test "$DIGEST" != "None"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

          echo "Git SHA: $GITHUB_SHA"
          echo "Digest: $DIGEST"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Verify EKS
        run: |
          kubectl get nodes

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.2

      - name: Deploy with Helm
        run: |
          helm upgrade --install "$RELEASE_NAME" \
            "$CHART_PATH" \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set image.repository="${IMAGE%:*}" \
            --set image.tag="${GITHUB_SHA}" \
            --set image.pullPolicy=IfNotPresent \
            --wait \
            --timeout 180s

      - name: Verify rollout
        run: |
          helm status "$RELEASE_NAME" -n "$NAMESPACE"

          kubectl rollout status \
            deployment/project-38 \
            -n "$NAMESPACE" \
            --timeout=180s

          kubectl get deployment -n "$NAMESPACE"
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl get service -n "$NAMESPACE"

      - name: Health smoke test
        run: |
          kubectl run project-38-health-smoke \
            -n "$NAMESPACE" \
            --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.12.1 \
            -- \
            curl -fsS \
            http://project-38.$NAMESPACE.svc.cluster.local/health

      - name: Version smoke test
        run: |
          kubectl run project-38-version-smoke \
            -n "$NAMESPACE" \
            --rm -i \
            --restart=Never \
            --image=curlimages/curl:8.12.1 \
            -- \
            curl -fsS \
            http://project-38.$NAMESPACE.svc.cluster.local/version

      - name: Final evidence
        run: |
          echo "=========================================="
          echo " PROJECT 38 CI/CD PASSED"
          echo "=========================================="
          echo "Git SHA: $GITHUB_SHA"
          echo "Digest: $IMAGE_DIGEST"
          echo "Cluster: $EKS_CLUSTER"
          echo "Namespace: $NAMESPACE"
          echo "Release: $RELEASE_NAME"
