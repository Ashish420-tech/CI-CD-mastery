name: Project 20 - Compose Secrets

on:
  push:
    branches:
      - project-20-compose-secrets
    paths:
      - 'project-20-compose-secrets/**'
      - '.github/workflows/project-20-compose-secrets.yml'

  pull_request:
    branches:
      - project-20-compose-secrets
    paths:
      - 'project-20-compose-secrets/**'
      - '.github/workflows/project-20-compose-secrets.yml'

jobs:
  compose-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r project-20-compose-secrets/requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q project-20-compose-secrets

      - name: Create CI environment
        working-directory: project-20-compose-secrets
        run: |
          cp .env.example .env

      - name: Create temporary CI secret
        working-directory: project-20-compose-secrets
        run: |
          mkdir -p secrets
          printf 'ci-secret-value\n' > secrets/app_secret.txt

      - name: Verify secret files are ignored
        working-directory: project-20-compose-secrets
        run: |
          git check-ignore -q .env
          git check-ignore -q secrets/app_secret.txt

      - name: Validate Compose
        working-directory: project-20-compose-secrets
        run: |
          docker compose config

      - name: Build and start stack
        working-directory: project-20-compose-secrets
        run: |
          docker compose up -d --build

      - name: Show services
        working-directory: project-20-compose-secrets
        run: |
          docker compose ps

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              project-20-api 2>/dev/null || true)

            echo "API health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker logs project-20-api
          exit 1

      - name: Verify Redis health
        run: |
          STATUS=$(docker inspect \
            --format '{{.State.Health.Status}}' \
            project-20-redis)

          echo "Redis health: $STATUS"

          test "$STATUS" = "healthy"

      - name: Verify secret mount
        run: |
          docker exec project-20-api \
            sh -c 'test -f /run/secrets/app_secret'

          echo "Secret mount verified"

      - name: Verify secret status
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8098/secret-status)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"secret_mounted":true'

      - name: Verify secret is not environment value
        run: |
          ENV_OUTPUT=$(docker exec project-20-api env)

          if echo "$ENV_OUTPUT" | grep -q 'ci-secret-value'; then
            echo "ERROR: Secret leaked into environment"
            exit 1
          fi

          echo "Secret is not exposed as an environment value"

      - name: Verify health
        run: |
          curl -fsS http://localhost:8098/health

      - name: Verify Redis integration
        run: |
          RESPONSE=$(curl -fsS \
            http://localhost:8098/counter)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"counter":1'

      - name: Verify secret not in image history
        run: |
          if docker history \
            ci-cd-mastery-project-20:1.0.0 | \
            grep -q 'ci-secret-value'; then
            echo "ERROR: Secret found in image history"
            exit 1
          fi

          echo "Secret not found in image history"

      - name: Show logs
        if: always()
        working-directory: project-20-compose-secrets
        run: |
          docker compose logs --tail 50

      - name: Cleanup
        if: always()
        working-directory: project-20-compose-secrets
        run: |
          docker compose down -v
