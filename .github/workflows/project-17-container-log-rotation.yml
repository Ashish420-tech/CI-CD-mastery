name: Project 17 - Container Log Rotation

on:
  push:
    branches:
      - project-17-container-log-rotation
    paths:
      - 'project-17-container-log-rotation/**'
      - '.github/workflows/project-17-container-log-rotation.yml'

  pull_request:
    branches:
      - project-17-container-log-rotation
    paths:
      - 'project-17-container-log-rotation/**'
      - '.github/workflows/project-17-container-log-rotation.yml'

jobs:
  log-rotation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask

      - name: Run tests
        run: |
          python -m pytest -q project-17-container-log-rotation

      - name: Build Docker image
        run: |
          docker build \
            -t ci-cd-mastery-project-17:1.0.0 \
            ./project-17-container-log-rotation

      - name: Run container with log rotation
        run: |
          docker run -d \
            --name project-17-app \
            -p 8095:5000 \
            -e APP_VERSION=1.0.0 \
            -e ENVIRONMENT=ci \
            --log-opt max-size=10k \
            --log-opt max-file=3 \
            ci-cd-mastery-project-17:1.0.0

      - name: Wait for healthy container
        run: |
          for i in {1..20}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              project-17-app)

            echo "Health status: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ]; then
              docker logs project-17-app
              exit 1
            fi

            sleep 2
          done

          docker logs project-17-app
          exit 1

      - name: Verify logging driver
        run: |
          DRIVER=$(docker inspect project-17-app \
            --format '{{.HostConfig.LogConfig.Type}}')

          echo "Logging driver: $DRIVER"

          test "$DRIVER" = "json-file"

      - name: Verify log rotation configuration
        run: |
          MAX_SIZE=$(docker inspect project-17-app \
            --format '{{index .HostConfig.LogConfig.Config "max-size"}}')

          MAX_FILE=$(docker inspect project-17-app \
            --format '{{index .HostConfig.LogConfig.Config "max-file"}}')

          echo "max-size=$MAX_SIZE"
          echo "max-file=$MAX_FILE"

          test "$MAX_SIZE" = "10k"
          test "$MAX_FILE" = "3"

      - name: Generate application logs
        run: |
          for i in $(seq 1 100); do
            curl -fsS http://localhost:8095/log >/dev/null
          done

      - name: Verify logs
        run: |
          docker logs --tail 10 project-17-app

      - name: Verify container state
        run: |
          docker inspect project-17-app \
            --format 'status={{.State.Status}} health={{.State.Health.Status}}'

      - name: Cleanup
        if: always()
        run: |
          docker rm -f project-17-app 2>/dev/null || true
