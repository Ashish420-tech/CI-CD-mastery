name: Project 37 - ECR Immutable Platform

on:
  push:
    branches: [project-37-ecr-immutable-image-platform]
  pull_request:
    branches: [project-37-ecr-immutable-image-platform]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify ECR
        run: |
          set -e

          aws ecr describe-repositories \
            --repository-names ci-cd-mastery/applications \
            --region ap-south-1

          aws ecr get-lifecycle-policy \
            --repository-name ci-cd-mastery/applications \
            --region ap-south-1

          echo "Project 37 ECR verification PASS"

      - name: Verify Terraform
        working-directory: infrastructure/eks
        run: |
          terraform init -backend=false
          terraform validate
