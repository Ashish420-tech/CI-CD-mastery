name: Project 43 - Kubernetes Network Policy Validation

on:
  push:
    branches:
      - project-43-kubernetes-network-security
    paths:
      - 'project-43-kubernetes-network-security/**'
      - '.github/workflows/project-43-network-policy-validation.yml'
  pull_request:
    branches:
      - project-43-kubernetes-network-security
    paths:
      - 'project-43-kubernetes-network-security/**'
      - '.github/workflows/project-43-network-policy-validation.yml'

permissions:
  contents: read

jobs:
  validate-network-policy:
    name: Validate NetworkPolicy Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate NetworkPolicy manifests
        shell: bash
        run: |
          set -euo pipefail

          POLICY_FILE="project-43-kubernetes-network-security/manifests/network-policy.yaml"

          echo "=============================================="
          echo "PROJECT 43 NETWORK POLICY VALIDATION"
          echo "=============================================="

          test -f "$POLICY_FILE"

          echo
          echo "Policy file:"
          echo "$POLICY_FILE"

          echo
          echo "NetworkPolicy count:"
          COUNT="$(grep -c '^kind: NetworkPolicy$' "$POLICY_FILE")"
          echo "$COUNT"

          test "$COUNT" -eq 4

          echo
          echo "Expected policies:"
          grep '^  name:' "$POLICY_FILE"

          echo
          echo "YAML syntax validation:"
          ruby -e '
          require "yaml"
          YAML.load_stream(File.read(ARGV[0]))
          puts "✓ YAML syntax valid"
          ' "$POLICY_FILE"

          echo
          echo "NetworkPolicy structure validation:"

          ruby - "$POLICY_FILE" <<'RUBY'
          require "yaml"

          file = ARGV[0]
          documents = YAML.load_stream(File.read(file))

          policies = documents.compact.select do |doc|
            doc.is_a?(Hash) && doc["kind"] == "NetworkPolicy"
          end

          abort "ERROR: expected 4 NetworkPolicy documents" unless policies.length == 4

          expected = [
            "project-38-default-deny-ingress",
            "project-38-default-deny-egress",
            "project-38-allow-dns",
            "project-38-allow-labeled-client"
          ]

          names = policies.map { |policy| policy.dig("metadata", "name") }

          abort "ERROR: unexpected NetworkPolicy names" unless names.sort == expected.sort

          policies.each do |policy|
            abort "ERROR: missing apiVersion" unless policy["apiVersion"] == "networking.k8s.io/v1"
            abort "ERROR: invalid kind" unless policy["kind"] == "NetworkPolicy"
            abort "ERROR: missing metadata.name" unless policy.dig("metadata", "name")
            abort "ERROR: missing spec" unless policy["spec"].is_a?(Hash)
          end

          puts "✓ 4 NetworkPolicies detected"
          puts "✓ API version: networking.k8s.io/v1"
          puts "✓ Required policy names present"
          puts "✓ Required policy specifications present"
          RUBY

          echo
          echo "=============================================="
          echo "NETWORK POLICY VALIDATION: PASS"
          echo "=============================================="
          echo "4 NetworkPolicies validated offline."
          echo "No Kubernetes cluster connection required."
          echo "=============================================="
