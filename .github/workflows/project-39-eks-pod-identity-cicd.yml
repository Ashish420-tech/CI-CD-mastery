name: Project 39 - EKS Pod Identity CI/CD

on:
  push:
    branches:
      - project-39-eks-pod-identity
  pull_request:
    branches:
      - project-39-eks-pod-identity

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: ci-cd-mastery-eks
  NAMESPACE: project-39
  SERVICE_ACCOUNT: project-39-app

jobs:

  security:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: infrastructure/eks
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infrastructure/eks
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infrastructure/eks
        run: terraform validate

      - name: Terraform Plan - Project 39
        working-directory: infrastructure/eks
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -target=aws_iam_role.project39_pod_identity \
            -target=aws_iam_role_policy.project39_pod_identity \
            -target=aws_eks_pod_identity_association.project39

  kubernetes:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Verify EKS connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Validate Namespace
        run: |
          kubectl apply \
            --dry-run=server \
            -f project-39-eks-pod-identity/manifests/namespace.yaml

      - name: Validate ServiceAccount
        run: |
          kubectl apply \
            --dry-run=server \
            -f project-39-eks-pod-identity/manifests/serviceaccount.yaml

      - name: Validate Identity Test Pod
        run: |
          kubectl apply \
            --dry-run=server \
            -f project-39-eks-pod-identity/manifests/identity-test-pod.yaml


  aws-verification:
    name: EKS Pod Identity Verification
    runs-on: ubuntu-latest
    needs:
      - security
      - terraform
      - kubernetes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EKS
        run: |
          aws eks describe-cluster \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'cluster.{Name:name,Status:status,Version:version}' \
            --output table

      - name: Verify Pod Identity Association
        run: |
          aws eks list-pod-identity-associations \
            --cluster-name "$EKS_CLUSTER" \
            --region "$AWS_REGION" \
            --query 'associations[?namespace==`project-39` && serviceAccount==`project-39-app`].{
              ID:associationId,
              Namespace:namespace,
              ServiceAccount:serviceAccount,
              Role:roleArn
            }' \
            --output table

      - name: Verify IAM Role
        run: |
          aws iam get-role \
            --role-name GitHubActions-Project39PodIdentityRole \
            --query 'Role.Arn' \
            --output text

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" \
            --region "$AWS_REGION"

      - name: Verify ServiceAccount
        run: |
          kubectl get serviceaccount \
            "$SERVICE_ACCOUNT" \
            -n "$NAMESPACE"

      - name: Pod Identity Smoke Test
        run: |
          kubectl delete pod project-39-identity-test \
            -n "$NAMESPACE" \
            --ignore-not-found=true

          kubectl apply \
            -f project-39-eks-pod-identity/manifests/identity-test-pod.yaml

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Succeeded \
            pod/project-39-identity-test \
            -n "$NAMESPACE" \
            --timeout=120s

          kubectl logs \
            project-39-identity-test \
            -n "$NAMESPACE"

          kubectl logs \
            project-39-identity-test \
            -n "$NAMESPACE" | grep \
            'GitHubActions-Project39PodIdentityRole'

          echo "PROJECT 39 POD IDENTITY CI/CD VALIDATION: PASS"
