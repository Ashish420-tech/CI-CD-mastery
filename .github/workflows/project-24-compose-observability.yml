name: Project 24 - Enterprise Docker Compose Observability

on:
  push:
    branches:
      - project-24-compose-observability
  pull_request:
    branches:
      - project-24-compose-observability

jobs:
  observability:
    name: Build, Test and Verify Observability
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-24-compose-observability

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Run application tests
        run: |
          PYTHONPATH=. pytest -q tests/test_metrics.py

      - name: Validate Docker Compose
        run: |
          docker compose config --quiet

      - name: Build API image
        run: |
          docker build --tag project-24-observability:ci .

      - name: Start observability stack
        run: |
          docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            API_STATUS="$(docker inspect --format='{{.State.Health.Status}}' project-24-api 2>/dev/null || true)"
            PROM_STATUS="$(docker inspect --format='{{.State.Health.Status}}' project-24-prometheus 2>/dev/null || true)"

            echo "Attempt $i: API=$API_STATUS Prometheus=$PROM_STATUS"

            if [ "$API_STATUS" = "healthy" ] && [ "$PROM_STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Verify API health
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/health

      - name: Verify application metrics
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/metrics \
            | grep 'flask_http_requests_total'

      - name: Verify Prometheus health
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:9090/-/healthy

      - name: Verify Prometheus scrape target
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:9090/api/v1/targets \
            | python -c "import json,sys; data=json.load(sys.stdin); targets=data['data']['activeTargets']; assert any(t['labels'].get('job') == 'flask-api' and t['health'] == 'up' and t['lastError'] == '' for t in targets)"

      - name: Verify Prometheus metric query
        run: |
          curl --fail --silent --show-error \
            'http://127.0.0.1:9090/api/v1/query?query=flask_http_requests_total' \
            | python -c "import json,sys; data=json.load(sys.stdin); assert data['status'] == 'success'; assert data['data']['result']"

      - name: Show service status
        if: always()
        run: |
          docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
