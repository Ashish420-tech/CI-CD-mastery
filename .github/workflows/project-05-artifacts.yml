name: Project 05 - CI Artifacts

on:
  push:
    branches:
      - project-05-ci-artifacts
  pull_request:
    branches:
      - project-05-ci-artifacts

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest -v project-05-ci-artifacts/test_app.py

      - name: Generate test artifacts
        run: |
          mkdir -p artifacts

          echo "CI Test Result" > artifacts/test-result.txt
          echo "Python Version: $(python --version)" >> artifacts/test-result.txt
          echo "Test Status: PASS" >> artifacts/test-result.txt

          echo "Python Version: $(python --version)" > artifacts/environment.txt
          echo "Runner OS: $(uname -s)" >> artifacts/environment.txt

          echo "Project: Project 05 - CI Artifacts" > artifacts/summary.txt
          echo "Test Status: PASS" >> artifacts/summary.txt
          echo "Artifact Files: 3" >> artifacts/summary.txt

      - name: Verify test artifacts
        run: |
          find artifacts -type f -maxdepth 1 -print

          echo "----- test-result.txt -----"
          cat artifacts/test-result.txt

          echo "----- environment.txt -----"
          cat artifacts/environment.txt

          echo "----- summary.txt -----"
          cat artifacts/summary.txt

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-test-artifacts
          path: artifacts/
