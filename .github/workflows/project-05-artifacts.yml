name: Project 05 - CI Artifacts

on:
  push:
    branches:
      - project-05-ci-artifacts
  pull_request:
    branches:
      - project-05-ci-artifacts

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest -v project-05-ci-artifacts/test_app.py


      - name: Generate test result
        run: |
          echo "CI Test Result" > test-result.txt
          echo "Python Version: $(python --version)" >> test-result.txt
          echo "Test Status: PASS" >> test-result.txt
      - name: Verify test result file
        run: |
          ls -l test-result.txt
          cat test-result.txt
      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result.txt
