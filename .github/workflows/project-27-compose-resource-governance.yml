name: Project 27 - Compose Resource Governance

on:
  push:
    branches:
      - project-27-compose-resource-governance
  pull_request:
    branches:
      - project-27-compose-resource-governance

jobs:
  test:
    name: Resource Governance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PyYAML

      - name: Run pytest
        working-directory: project-27-compose-resource-governance
        run: pytest -q

      - name: Validate Compose
        working-directory: project-27-compose-resource-governance
        run: docker compose config

      - name: Build Docker image
        working-directory: project-27-compose-resource-governance
        run: docker compose build

      - name: Start application
        working-directory: project-27-compose-resource-governance
        run: docker compose up -d

      - name: Verify application health
        working-directory: project-27-compose-resource-governance
        run: |
          set -e

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5001/health; then
              echo
              echo "Application healthy."
              exit 0
            fi
            sleep 2
          done

          docker compose logs
          exit 1

      - name: Verify application functionality
        working-directory: project-27-compose-resource-governance
        run: |
          curl -fsS http://localhost:5001/
          echo

      - name: Verify CPU limit
        working-directory: project-27-compose-resource-governance
        run: |
          CPU=$(docker inspect "$(docker compose ps -q app)" \
            --format '{{.HostConfig.NanoCpus}}')

          echo "NanoCPUs=${CPU}"

          test "$CPU" = "500000000"

      - name: Verify memory limit
        working-directory: project-27-compose-resource-governance
        run: |
          MEMORY=$(docker inspect "$(docker compose ps -q app)" \
            --format '{{.HostConfig.Memory}}')

          echo "MemoryBytes=${MEMORY}"

          test "$MEMORY" = "268435456"

      - name: Verify non-root execution
        working-directory: project-27-compose-resource-governance
        run: |
          USER_ID=$(docker inspect "$(docker compose ps -q app)" \
            --format '{{.Config.User}}')

          echo "Container user=${USER_ID}"

          test "$USER_ID" = "10001:10001"

      - name: Verify no-new-privileges
        working-directory: project-27-compose-resource-governance
        run: |
          docker inspect "$(docker compose ps -q app)" \
            --format '{{json .HostConfig.SecurityOpt}}' |
            grep -q 'no-new-privileges:true'

      - name: Cleanup
        if: always()
        working-directory: project-27-compose-resource-governance
        run: docker compose down -v
