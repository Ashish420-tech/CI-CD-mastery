name: Project 19 - Compose Enterprise Configuration

on:
  push:
    branches:
      - project-19-compose-enterprise-config
    paths:
      - 'project-19-compose-enterprise-config/**'
      - '.github/workflows/project-19-compose-enterprise-config.yml'

  pull_request:
    branches:
      - project-19-compose-enterprise-config
    paths:
      - 'project-19-compose-enterprise-config/**'
      - '.github/workflows/project-19-compose-enterprise-config.yml'

jobs:
  enterprise-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r project-19-compose-enterprise-config/requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q project-19-compose-enterprise-config

      - name: Create CI environment configuration
        working-directory: project-19-compose-enterprise-config
        run: |
          cp .env.example .env

          sed -i 's/ENVIRONMENT=development/ENVIRONMENT=ci/' .env
          sed -i 's/APP_VERSION=1.0.0/APP_VERSION=1.0.0-ci/' .env

      - name: Verify .env is ignored
        working-directory: project-19-compose-enterprise-config
        run: |
          git check-ignore -q .env

      - name: Validate Compose configuration
        working-directory: project-19-compose-enterprise-config
        run: |
          docker compose config

      - name: Build and start stack
        working-directory: project-19-compose-enterprise-config
        run: |
          docker compose up -d --build

      - name: Show Compose services
        working-directory: project-19-compose-enterprise-config
        run: |
          docker compose ps

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              project-19-api 2>/dev/null || true)

            echo "API health: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker logs project-19-api
          exit 1

      - name: Verify Redis health
        run: |
          STATUS=$(docker inspect \
            --format '{{.State.Health.Status}}' \
            project-19-redis)

          echo "Redis health: $STATUS"

          test "$STATUS" = "healthy"

      - name: Verify runtime configuration
        run: |
          RESPONSE=$(curl -fsS http://localhost:8097/config)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"application":"project-19"'
          echo "$RESPONSE" | grep -q '"version":"1.0.0-ci"'
          echo "$RESPONSE" | grep -q '"environment":"ci"'
          echo "$RESPONSE" | grep -q '"log_level":"INFO"'
          echo "$RESPONSE" | grep -q '"redis_host":"redis"'

      - name: Verify health endpoint
        run: |
          curl -fsS http://localhost:8097/health

      - name: Verify counter
        run: |
          RESPONSE=$(curl -fsS http://localhost:8097/counter)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"counter":1'

      - name: Verify container environment
        run: |
          docker exec project-19-api env | \
            grep -E 'APP_NAME|APP_VERSION|ENVIRONMENT|LOG_LEVEL|REDIS_HOST|REDIS_PORT|FEATURE_COUNTER'

      - name: Show logs
        if: always()
        working-directory: project-19-compose-enterprise-config
        run: |
          docker compose logs --tail 50

      - name: Cleanup
        if: always()
        working-directory: project-19-compose-enterprise-config
        run: |
          docker compose down -v
