name: Project 25 - Enterprise Docker Compose Secrets

on:
  push:
    branches:
      - project-25-compose-secrets
  pull_request:
    branches:
      - project-25-compose-secrets

jobs:
  secrets:
    name: Build, Test and Verify Secrets
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-25-compose-secrets

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pytest

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -q tests/test_secrets.py

      - name: Create CI secret
        run: |
          mkdir -p secrets
          python - <<'PY'
          from pathlib import Path
          Path("secrets/app_secret").write_text(
              "ci-test-secret-value\n",
              encoding="utf-8",
          )
          PY
          chmod 0440 secrets/app_secret

      - name: Validate Compose
        run: |
          docker compose config --quiet

      - name: Build image
        run: |
          docker compose build

      - name: Start stack
        run: |
          docker compose up -d

      - name: Wait for healthy container
        run: |
          for i in {1..30}; do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' project-25-api 2>/dev/null || true)"
            echo "Attempt $i: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps
          docker compose logs
          exit 1

      - name: Verify API health
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/health

      - name: Verify runtime secret
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/secret-status \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d['secret_available'] is True; assert d['secret_length'] > 0"

      - name: Verify secret mount
        run: |
          docker exec project-25-api \
            sh -c 'test -f /run/secrets/app_secret'

      - name: Verify secret is not environment variable
        run: |
          if docker exec project-25-api env | grep -qiE 'APP_SECRET|app_secret'; then
            echo "Secret exposed through environment"
            exit 1
          fi

      - name: Verify secret is not in image history
        run: |
          if docker history project-25-compose-secrets-api | grep -qiE 'ci-test-secret-value|app_secret'; then
            echo "Possible secret leakage detected in image history"
            exit 1
          fi

      - name: Show status
        if: always()
        run: |
          docker compose ps

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
