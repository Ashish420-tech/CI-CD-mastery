name: Project 06 - CI

on:
  push:
    branches:
      - project-06-environments-deployment-gates
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project-06-environments-deployment-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Generate deployment candidate
        run: |
          rm -rf deployment-candidate
          mkdir -p deployment-candidate

          python app.py > deployment-candidate/application-output.txt

          cat > deployment-candidate/version.txt <<EOF_VERSION
          Application Version: 1.0.0
          EOF_VERSION

          cat > deployment-candidate/deployment-status.txt <<EOF_STATUS
          Deployment Candidate: READY
          EOF_STATUS

          echo "Deployment candidate generated:"
          find deployment-candidate -maxdepth 1 -type f -print

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: development

    defaults:
      run:
        working-directory: project-06-environments-deployment-gates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          echo "========================================"
          echo "Deployment Environment: development"
          echo "Deployment Target: ${{ vars.DEPLOYMENT_TARGET }}"
          echo "Application Version: 1.0.0"
          echo "Deployment Status: SUCCESS"
          echo "========================================"
