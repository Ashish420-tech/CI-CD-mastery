name: Project 22 - Enterprise Compose Networking

on:
  push:
    branches:
      - project-22-compose-networking
  pull_request:
    branches:
      - main
      - project-22-compose-networking

permissions:
  contents: read

defaults:
  run:
    working-directory: project-22-compose-networking

jobs:

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q


  compose-validation:
    name: Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f compose.yml config


  networking:
    name: Docker Networking Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^APP_PORT=.*/APP_PORT=8110/' .env

      - name: Build application image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps

      - name: Wait for healthy services
        run: |
          for i in {1..30}; do
            API_HEALTH=$(docker inspect project22-api \
              --format='{{.State.Health.Status}}' 2>/dev/null || true)

            REDIS_HEALTH=$(docker inspect project22-redis \
              --format='{{.State.Health.Status}}' 2>/dev/null || true)

            echo "API=$API_HEALTH Redis=$REDIS_HEALTH"

            if [ "$API_HEALTH" = "healthy" ] && [ "$REDIS_HEALTH" = "healthy" ]; then
              exit 0
            fi

            sleep 2
          done

          echo "Services did not become healthy"
          docker compose logs
          exit 1

      - name: Run networking verification
        run: ./verify-networking.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
