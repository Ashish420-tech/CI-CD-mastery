services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-25-api
    init: true
    restart: unless-stopped
    ports:
      - "5000:5000"
    secrets:
      - app_secret
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

secrets:
  app_secret:
    file: ./secrets/app_secret
