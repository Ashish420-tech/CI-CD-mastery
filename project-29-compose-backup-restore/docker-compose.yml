services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5001:5000"

    environment:
      DATA_DIR: /data

    volumes:
      - app-data:/data

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
    name: project-29-backup-restore-data
