services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "5001:5000"

    cpus: "0.50"
    mem_limit: 256m
    mem_reservation: 64m

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    security_opt:
      - no-new-privileges:true
