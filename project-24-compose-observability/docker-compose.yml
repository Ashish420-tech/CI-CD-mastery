services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-24-api
    init: true
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: project-24-prometheus
    restart: unless-stopped
    init: true
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider -q http://127.0.0.1:9090/-/healthy
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    networks:
      - observability

networks:
  observability:
    driver: bridge
