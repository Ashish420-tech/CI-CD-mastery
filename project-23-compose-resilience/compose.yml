services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: project23-api

    restart: unless-stopped
    init: true

    stop_signal: SIGTERM
    stop_grace_period: 20s

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TIMEOUT: 2
      PORT: 5000

    ports:
      - "${APP_PORT:-8123}:5000"

    networks:
      app_net:
        aliases:
          - api
          - project23-api

    depends_on:
      redis:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine

    container_name: project23-redis

    restart: unless-stopped
    init: true

    stop_signal: SIGTERM
    stop_grace_period: 15s

    command:
      - redis-server
      - --appendonly
      - yes
      - --save
      - "60"
      - "1"

    networks:
      app_net:
        aliases:
          - redis
          - project23-redis

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s

    security_opt:
      - no-new-privileges:true

networks:
  app_net:
    name: project23_resilience_net
    driver: bridge
